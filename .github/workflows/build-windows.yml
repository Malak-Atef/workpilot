name: Build WorkPilot Windows Desktop Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App & Sidecar
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Python Dependencies & PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Standalone Backend Sidecar
        shell: cmd
        run: |
          cd backend
          pyinstaller --noconfirm workpilot_backend.spec

      - name: Place Sidecar Executable for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item backend/dist/workpilot-backend.exe src-tauri/binaries/workpilot-backend-x86_64-pc-windows-msvc.exe -Force
          Get-ChildItem src-tauri/binaries

      - name: Install Frontend Dependencies
        shell: cmd
        run: npm install

      - name: Build Tauri Windows Application
        shell: cmd
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: WorkPilot-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
